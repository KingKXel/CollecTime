<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="apple-touch-icon" href="icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CollecTime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050b06; --panel:#0a1510; --panel2:#0f1c14; --line:#1e3324;
  --text:#cdf5d6; --sub:#5f8a6b; --accent:#39ff6a; --accent2:#9dffb8;
  --high:#ff5f56; --med:#ffc857; --low:#39ff6a;
  --done:#33493a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef4ee; --panel:#ffffff; --panel2:#e3ece3; --line:#c3d6c5;
    --text:#0e2213; --sub:#4d6852; --done:#b7c9b9;
  }
}
:root[data-theme="dark"]{ --bg:#050b06; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  height:100%; position:relative;
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.scanlines{
  position:fixed; inset:0; pointer-events:none; z-index:50; mix-blend-mode:overlay;
  background:repeating-linear-gradient(180deg, rgba(57,255,106,.05) 0px, rgba(57,255,106,.05) 1px, transparent 2px, transparent 3px);
}
header{
  padding:26px 20px 16px; position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:linear-gradient(180deg,var(--bg) 75%,transparent);
}
.brand{display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:16px}
.logo{flex:none; filter:drop-shadow(0 0 6px rgba(57,255,106,.55))}
h1{
  font-family:'VT323',monospace; font-size:38px; margin:0; line-height:1;
  letter-spacing:0.04em; color:var(--text); text-shadow:0 0 10px rgba(57,255,106,.35);
}
h1 span{color:var(--accent)}
.tagline{color:var(--sub); font-size:13px; margin:8px 0 18px; max-width:60ch}
.stats{display:flex; gap:10px; flex-wrap:wrap}
.stat{
  background:var(--panel); border:1px solid var(--line); border-radius:2px;
  padding:10px 14px; flex:1; min-width:100px; border-left:2px solid var(--accent);
}
.stat b{display:block; font-family:'VT323',monospace; font-size:26px; color:var(--accent); line-height:1}
.stat small{color:var(--sub); font-size:11px}
main{max-width:760px; margin:0 auto; padding:0 16px 96px}
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  display:flex; align-items:flex-end; justify-content:space-around;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:rgba(10,21,16,.86); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .tabbar{ background:rgba(255,255,255,.86); }
}
.tab{
  background:none; border:none; color:var(--sub); font-family:'IBM Plex Mono',monospace; font-size:10px;
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 14px; cursor:pointer;
  flex:1; max-width:110px;
}
.tab svg{stroke:var(--sub); transition:.15s}
.tab.active{color:var(--accent)}
.tab.active svg{stroke:var(--accent)}
.tab-add{margin-top:-26px}
.tab-add .add-btn{
  width:52px; height:52px; border-radius:6px; background:var(--accent);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 4px var(--bg), 0 0 0 5px var(--line), 0 8px 18px rgba(0,0,0,.5);
}
.tab-add .add-btn svg{stroke:#04210f}
.tab-add span{color:var(--sub); font-size:10px}
.controls{
  display:flex; gap:8px; margin:18px 0 14px; overflow-x:auto; padding-bottom:2px;
}
.chip{
  border:1px solid var(--line); background:var(--panel); color:var(--sub);
  padding:6px 12px; border-radius:2px; font-size:13px; cursor:pointer; white-space:nowrap;
  transition:.15s; font-family:'IBM Plex Mono',monospace;
}
.chip.active{background:var(--accent); color:#04210f; border-color:var(--accent); font-weight:600}
.console-group{margin-bottom:22px}
.finished-group{margin-top:30px; padding-top:14px; border-top:1px dashed var(--line)}
.finished-group .console-title{color:var(--done)}
.console-title{
  font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--sub);
  display:flex; align-items:center; gap:8px; margin:0 0 8px; padding-left:2px;
  text-transform:lowercase;
}
.console-title::before{content:"//"; color:var(--line)}
.console-title::after{content:""; flex:1; height:1px; background:var(--line)}
.card{
  background:var(--panel); border:1px solid var(--line); border-left:2px solid var(--line); border-radius:2px;
  padding:14px 16px; margin-bottom:8px; display:flex; gap:12px; align-items:flex-start;
  transition:.15s;
}
.card:hover{border-left-color:var(--accent)}
.card.done{opacity:.5}
.card.done .title{text-decoration:line-through}
.check{
  width:20px; height:20px; border-radius:2px; border:2px solid var(--line); flex:none;
  margin-top:2px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  background:transparent; color:#04210f; font-size:12px; font-family:'IBM Plex Mono',monospace;
}
.check.on{background:var(--accent); border-color:var(--accent)}
.card-body{flex:1; min-width:0}
.row1{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.title{font-weight:600; font-size:15px}
.hours{font-family:'VT323',monospace; color:var(--accent2); font-size:19px; white-space:nowrap}
.meta{color:var(--sub); font-size:12.5px; margin-top:3px}
.badges{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.badge{font-size:11px; padding:3px 8px; border-radius:2px; border:1px solid var(--line); color:var(--sub); font-family:'IBM Plex Mono',monospace}
.badge.prio-Haute{color:var(--high); border-color:var(--high)}
.badge.prio-Moyenne{color:var(--med); border-color:var(--med)}
.badge.prio-Basse{color:var(--low); border-color:var(--low)}
.badge.status{background:var(--panel2)}
.notes{color:var(--sub); font-size:12.5px; margin-top:6px; line-height:1.4}
.avg{font-size:11px; color:var(--sub); margin-top:6px; font-family:'IBM Plex Mono',monospace}
.avg b{color:var(--text)}

dialog{
  border:1px solid var(--line); border-radius:2px; background:var(--panel); color:var(--text);
  padding:20px; width:min(420px,90vw); margin:auto; box-shadow:0 0 40px rgba(57,255,106,.08);
}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h3{font-family:'VT323',monospace; font-size:24px; margin-top:0; letter-spacing:.03em}
label{display:block; font-size:11px; color:var(--sub); margin:12px 0 4px; font-family:'IBM Plex Mono',monospace}
input,select,textarea{
  width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
  border-radius:2px; padding:9px 10px; font-family:inherit; font-size:14px;
}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent); border-color:var(--accent)}
textarea{resize:vertical; min-height:50px}
.dialog-actions{display:flex; gap:8px; margin-top:18px}
button.primary{
  background:var(--accent); color:#04210f; border:none; border-radius:2px;
  padding:10px 16px; font-weight:600; cursor:pointer; flex:1;
}
button.ghost{
  background:transparent; color:var(--sub); border:1px solid var(--line); border-radius:2px;
  padding:10px 16px; cursor:pointer;
}
.del{
  width:100%; margin-top:10px; background:transparent; border:1px solid var(--high); color:var(--high);
  border-radius:2px; padding:10px 16px; font-size:13px; cursor:pointer; font-family:'IBM Plex Mono',monospace;
}
.del:hover{background:var(--high); color:#2a0a08}
.empty{color:var(--sub); text-align:center; padding:40px 0; font-size:14px}
</style>
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>
<header>
  <div class="brand">
    <svg class="logo" width="34" height="34" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="var(--accent)">
        <rect x="0" y="0" width="32" height="4"/><rect x="0" y="28" width="32" height="4"/>
        <rect x="4" y="4" width="24" height="4"/><rect x="4" y="24" width="24" height="4"/>
        <rect x="8" y="8" width="16" height="4"/><rect x="8" y="20" width="16" height="4"/>
        <rect x="12" y="12" width="8" height="8"/>
      </g>
    </svg>
    <h1>Collec<span>Time</span></h1>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div class="controls" id="filters"></div>
  <div id="list"></div>
</main>

<nav class="tabbar">
  <button class="tab" id="tab-backlog" onclick="setTab('backlog')">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"><rect x="3" y="3" width="16" height="6"/><rect x="3" y="13" width="16" height="6"/></svg>
    <span>Backlog</span>
  </button>
  <button class="tab tab-add" onclick="openDialog()">
    <span class="add-btn"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke-width="2.5" stroke-linecap="square"><line x1="11" y1="4" x2="11" y2="18"/><line x1="4" y1="11" x2="18" y2="11"/></svg></span>
    <span>Ajouter</span>
  </button>
  <button class="tab" id="tab-finished" onclick="setTab('finished')">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square"><polyline points="3,11 9,17 19,4"/></svg>
    <span>Terminés</span>
  </button>
</nav>

<dialog id="dlg">
  <h3 id="dlg-title">Ajouter un jeu</h3>
  <form id="form">
    <label>Titre</label>
    <input required id="f-title">
    <label>Console</label>
    <input required id="f-console" list="consoles">
    <datalist id="consoles"></datalist>
    <label>Genre</label>
    <input id="f-genre">
    <label>Priorité</label>
    <select id="f-prio"><option>Haute</option><option>Moyenne</option><option>Basse</option></select>
    <label>Statut</label>
    <select id="f-status"><option>À commencer</option><option>En cours</option><option>Terminé</option></select>
    <label>Temps estimé (h)</label>
    <div style="display:flex; gap:8px">
      <input id="f-hours" type="number" min="0" step="0.5" style="flex:1">
      <button type="button" id="lookup-btn" class="ghost" style="white-space:nowrap; display:none">Chercher</button>
    </div>
    <div id="lookup-note" style="font-size:11px; color:var(--sub); margin-top:4px"></div>
    <label>Notes</label>
    <textarea id="f-notes"></textarea>
    <div class="dialog-actions">
      <button type="button" class="ghost" onclick="dlg.close()">Annuler</button>
      <button type="submit" class="primary">Enregistrer</button>
    </div>
    <button type="button" class="del" id="del-btn" style="display:none">Supprimer ce jeu de la liste</button>
  </form>
</dialog>

<script>
const SEED = [
{title:"Metal Gear Solid HD Collection",console:"PS Vita",genre:"Infiltration",priority:"Haute",status:"En cours",hours:30,avg:"MGS2+MGS3 ≈ 30h histoire",notes:"MGS 2 et MGS 3 en nomade"},
{title:"The Legend of Zelda: Twilight Princess HD",console:"Wii U",genre:"Action-Aventure",priority:"Moyenne",status:"À commencer",hours:35,avg:"≈ 34h histoire (HLTB)",notes:"Classique incontournable"},
{title:"The Legend of Zelda: Tears of the Kingdom",console:"Switch",genre:"Action-Aventure",priority:"Haute",status:"En cours",hours:120,avg:"≈ 60h histoire / ≈ 110h histoire+extra (HLTB)",notes:"Exploration des profondeurs et des îles célestes"},
{title:"Marvel's Spider-Man",console:"PS5",genre:"Action-Aventure",priority:"Haute",status:"À commencer",hours:20,avg:"≈ 17h histoire (HLTB)",notes:"Aventure new-yorkaise de Peter Parker"},
{title:"Marvel's Spider-Man 2",console:"PS5",genre:"Action-Aventure",priority:"Haute",status:"À commencer",hours:20,avg:"≈ 17h histoire (HLTB)",notes:"Suite avec Peter et Miles"},
{title:"The Last of Us Part II",console:"PS5",genre:"Action-Aventure / Survival",priority:"Haute",status:"À commencer",hours:25,avg:"≈ 25h histoire (HLTB)",notes:"Récit narratif intense et sombre"},
{title:"Cyberpunk 2077",console:"Switch 2",genre:"Action-RPG",priority:"Haute",status:"À commencer",hours:60,avg:"≈ 40-45h histoire (HLTB)",notes:"Immersion futuriste"},
{title:"The Elder Scrolls V: Skyrim",console:"Switch 2",genre:"Action-RPG",priority:"Moyenne",status:"En cours",hours:100,avg:"≈ 34h histoire / ≈ 100h toutes approches (HLTB)",notes:"Exploration et quêtes infinies"}
];
const PRIO_ORDER={Haute:0,Moyenne:1,Basse:2};
let games, filter="all", editIndex=null, currentTab="backlog";
const pendingIds = new Set();
function uid(){ return 'g'+Math.random().toString(36).slice(2,9); }
function setTab(t){ currentTab=t; render(); }

function load(){
  try{
    const raw = localStorage.getItem("backlog_games_v1");
    games = raw ? JSON.parse(raw) : structuredClone(SEED);
  }catch(e){ games = structuredClone(SEED); }
  games.forEach(g=>{ if(!g.id) g.id = uid(); });
}
function save(){
  try{ localStorage.setItem("backlog_games_v1", JSON.stringify(games)); }catch(e){}
}

function render(){
  const stats = document.getElementById("stats");
  const remaining = games.filter(g=>g.status!=="Terminé");
  const totalH = remaining.reduce((s,g)=>s+(+g.hours||0),0);
  const high = remaining.filter(g=>g.priority==="Haute").length;
  stats.innerHTML = `
    <div class="stat"><b>${remaining.length}</b><small>jeux restants</small></div>
    <div class="stat"><b>${totalH}h</b><small>temps restant estimé</small></div>
    <div class="stat"><b>${high}</b><small>priorité haute</small></div>
  `;

  document.getElementById("tab-backlog").classList.toggle("active", currentTab==="backlog");
  document.getElementById("tab-finished").classList.toggle("active", currentTab==="finished");

  const consoles = [...new Set(games.map(g=>g.console))];
  document.getElementById("consoles").innerHTML = consoles.map(c=>`<option value="${c}">`).join("");

  const list = document.getElementById("list");
  const filters = document.getElementById("filters");

  if(currentTab==="finished"){
    filters.innerHTML = "";
    const finished = games.filter(g=>g.status==="Terminé");
    if(finished.length===0){
      list.innerHTML = `<div class="empty">Aucun jeu terminé pour l'instant.</div>`;
      return;
    }
    const byConsole = {};
    finished.forEach(g=>{ (byConsole[g.console]=byConsole[g.console]||[]).push(g); });
    list.innerHTML = Object.keys(byConsole).sort().map(c=>`<div class="console-group">
        <div class="console-title">${c}</div>
        ${byConsole[c].map(g=>cardHTML(g)).join("")}
      </div>`).join("");
    return;
  }

  const opts = [["all","Tous"],["Haute","Haute"],["Moyenne","Moyenne"],["Basse","Basse"],["En cours","En cours"]];
  filters.innerHTML = opts.map(([v,l])=>`<button class="chip ${filter===v?'active':''}" onclick="setFilter('${v}')">${l}</button>`).join("");

  const active = games.filter(g=>g.status!=="Terminé").filter(g=>{
    if(filter==="all") return true;
    if(["Haute","Moyenne","Basse"].includes(filter)) return g.priority===filter;
    return g.status===filter;
  });
  const byConsole = {};
  active.forEach(g=>{ (byConsole[g.console]=byConsole[g.console]||[]).push(g); });

  if(active.length===0){
    list.innerHTML = `<div class="empty">Aucun jeu ici. Ajoute-en un avec l'onglet Ajouter.</div>`;
    return;
  }
  list.innerHTML = Object.keys(byConsole).sort().map(c=>{
    const items = byConsole[c].slice().sort((a,b)=>PRIO_ORDER[a.priority]-PRIO_ORDER[b.priority]);
    return `<div class="console-group">
      <div class="console-title">${c}</div>
      ${items.map(g=>cardHTML(g)).join("")}
    </div>`;
  }).join("");
}

function cardHTML(g){
  const done = g.status==="Terminé";
  const pending = pendingIds.has(g.id);
  return `<div class="card ${done||pending?'done':''}">
    <button class="check ${done||pending?'on':''}" onclick="toggleDone('${g.id}')">${done||pending?'&#10003;':''}</button>
    <div class="card-body" onclick="openDialogById('${g.id}')">
      <div class="row1"><span class="title">${esc(g.title)}</span><span class="hours">${g.hours||0}h</span></div>
      <div class="meta">${esc(g.genre||"")}</div>
      <div class="badges">
        <span class="badge prio-${g.priority}">${g.priority}</span>
        <span class="badge status">${g.status}</span>
      </div>
      ${g.avg?`<div class="avg">Moyenne web : <b>${esc(g.avg)}</b></div>`:""}
      ${g.notes?`<div class="notes">${esc(g.notes)}</div>`:""}
    </div>
  </div>`;
}
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function setFilter(v){ filter=v; render(); }
function toggleDone(id){
  const g = games.find(x=>x.id===id);
  if(!g) return;
  if(g.status==="Terminé"){
    g.status = "À commencer";
    pendingIds.delete(id);
    save(); render();
    return;
  }
  if(pendingIds.has(id)) return;
  pendingIds.add(id);
  render();
  setTimeout(()=>{
    if(pendingIds.has(id)){
      pendingIds.delete(id);
      const g2 = games.find(x=>x.id===id);
      if(g2){ g2.status = "Terminé"; save(); }
      render();
    }
  }, 5000);
}

const dlg = document.getElementById("dlg");
const fld = {
  title: document.getElementById("f-title"),
  console: document.getElementById("f-console"),
  genre: document.getElementById("f-genre"),
  prio: document.getElementById("f-prio"),
  status: document.getElementById("f-status"),
  hours: document.getElementById("f-hours"),
  notes: document.getElementById("f-notes")
};
let lookupAvgNote = "";
let originalTitle = "";
function openDialogById(id){
  const idx = games.findIndex(x=>x.id===id);
  openDialog(idx>=0?idx:undefined);
}
function openDialog(i){
  editIndex = (typeof i === "number") ? i : null;
  const g = editIndex!==null ? games[editIndex] : {title:"",console:"",genre:"",priority:"Haute",status:"À commencer",hours:"",notes:""};
  originalTitle = (g.title||"").trim().toLowerCase();
  document.getElementById("dlg-title").textContent = editIndex!==null ? "Modifier le jeu" : "Ajouter un jeu";
  fld.title.value=g.title; fld.console.value=g.console; fld.genre.value=g.genre||"";
  fld.prio.value=g.priority; fld.status.value=g.status; fld.hours.value=g.hours||"";
  fld.notes.value=g.notes||"";
  document.getElementById("del-btn").style.display = editIndex!==null ? "block" : "none";
  lookupAvgNote = "";
  document.getElementById("lookup-note").textContent = g.avg || "";
  if (typeof dlg.showModal === "function") { dlg.showModal(); } else { dlg.setAttribute("open",""); }
}
document.getElementById("form").addEventListener("submit", e=>{
  e.preventDefault();
  const g = {
    title:fld.title.value.trim(), console:fld.console.value.trim(), genre:fld.genre.value.trim(),
    priority:fld.prio.value, status:fld.status.value, hours:parseFloat(fld.hours.value)||0,
    notes:fld.notes.value.trim(), avg: lookupAvgNote || (editIndex!==null?games[editIndex].avg:"")
  };
  if(!g.title || !g.console) return;
  if(editIndex!==null){ g.id = games[editIndex].id; games[editIndex]=g; } else { g.id = uid(); games.push(g); }
  save(); dlg.close(); render();
});
document.getElementById("del-btn").addEventListener("click", ()=>{
  if(editIndex!==null && confirm(`Supprimer "${games[editIndex].title}" de ta liste ?`)){
    games.splice(editIndex,1); save(); dlg.close(); render();
  }
});

let sampleFn = null;
(async ()=>{
  try{ sampleFn = (typeof claude !== "undefined") ? await claude.use("sample") : null; }catch(e){ sampleFn = null; }
  if(sampleFn) document.getElementById("lookup-btn").style.display = "inline-block";
})();

const lookupBtn = document.getElementById("lookup-btn");
const lookupNote = document.getElementById("lookup-note");
async function doLookup(){
  const title = fld.title.value.trim();
  if(!title){ lookupNote.textContent = "Entre d'abord le nom du jeu."; return; }
  if(!sampleFn){ return; }
  lookupBtn.disabled = true; lookupBtn.textContent = "...";
  lookupNote.textContent = "Estimation en cours...";
  try{
    const prompt = `Le nom de jeu vidéo suivant vient d'être saisi par un utilisateur, il est peut-être mal écrit, incomplet, ou totalement inconnu/inexistant : "${title}". Si tu reconnais un vrai jeu vidéo correspondant (même avec une orthographe approximative), réponds avec un JSON strict : {"found": true, "title": "<nom officiel exact du jeu, bien orthographié>", "hours": <nombre entier d'heures pour l'histoire principale>, "genre": "<genre principal, ex: 'Action-Aventure'>", "note": "<courte précision sur le temps, ex: '~40h histoire, ~90h en 100%'>", "description": "<une phrase très courte décrivant le jeu, en français>"}. Si tu ne reconnais AUCUN jeu réel correspondant à ce nom (jeu inexistant, rumeur non confirmée, ou nom trop ambigu), réponds plutôt avec {"found": false, "note": "Jeu non reconnu, vérifie l'orthographe ou renseigne les infos manuellement."}. Réponds UNIQUEMENT avec ce JSON, sans texte autour.`;
    const res = await sampleFn.json(prompt, {modelTier:"default"});
    if(res && res.found === false){
      lookupNote.textContent = res.note || "Jeu non reconnu, renseigne les infos manuellement.";
    } else if(res && res.hours){
      if(res.title) fld.title.value = res.title;
      fld.hours.value = res.hours;
      if(res.genre) fld.genre.value = res.genre;
      if(res.description) fld.notes.value = res.description;
      lookupAvgNote = res.note || `≈ ${res.hours}h histoire principale (estimation)`;
      lookupNote.textContent = lookupAvgNote;
      originalTitle = (fld.title.value||"").trim().toLowerCase();
    } else {
      lookupNote.textContent = "Jeu non reconnu, renseigne les infos manuellement.";
    }
  }catch(e){
    lookupNote.textContent = "Recherche indisponible pour l'instant.";
  }
  lookupBtn.disabled = false; lookupBtn.textContent = "Chercher";
}
lookupBtn.addEventListener("click", doLookup);
fld.title.addEventListener("blur", ()=>{
  const t = fld.title.value.trim();
  if(!t || !sampleFn) return;
  if(t.toLowerCase() !== originalTitle) doLookup();
});

load(); render();
</script>
</body>
</html>
